<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jeu de cartes</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="game-container">
      <h1>Jeu de cartes</h1>

      <div class="header-stats">
        <p>Score : <strong id="score">0</strong> pts</p>
        <p>Tirage : <strong id="turn">0</strong> / 10</p>
        <p>Temps : <strong id="timer">60</strong>s</p>
      </div>

      <!-- Carte de l'ordinateur -->
      <section class="card-zone">
        <h2>Carte de l'ordinateur</h2>

        <div id="computer-card-display" class="computer-card">
          <div class="card">?</div>
        </div>
      </section>

      <hr />

      <!-- Main du joueur -->
      <section class="card-zone">
        <h2>Mes cartes</h2>
        <p class="info">Les cartes sont mélangées.</p>

        <div id="player-hand" class="player-cards"></div>
      </section>

      <div class="actions">
        <button id="btn-pass">Passer</button>
        <button id="btn-replay" class="hidden">Rejouer</button>
      </div>
    </main>
  </body>
</html>
